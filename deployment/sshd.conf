Match User lesamis-production,lesamis-staging,lesamis-dev
    AuthenticationMethods password
    PasswordAuthentication yes
    PubkeyAuthentication no
    KbdInteractiveAuthentication no
    PermitEmptyPasswords no
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no

Match User lesamis-production
    ForceCommand /usr/local/lib/les-amis/deploy.sh receive production

Match User lesamis-staging
    ForceCommand /usr/local/lib/les-amis/deploy.sh receive staging

Match User lesamis-dev
    ForceCommand /usr/local/lib/les-amis/deploy.sh receive dev

Match all
