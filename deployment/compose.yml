x-app: &app
  image: ${APP_IMAGE:?}
  env_file: ${APP_ENV_FILE:?}
  user: "${DEPLOY_UID:?}:${DEPLOY_GID:?}"
  environment:
    DEBUG: "false"
    DJANGO_BEHIND_HTTPS_PROXY: "true"
    SECRET_KEY: ${SECRET_KEY:?}
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *app
    command:
      - sh
      - -ec
      - |
        umask 022
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
    volumes:
      - type: bind
        source: ${STATIC_DIR:?}
        target: /app/staticfiles
        bind:
          create_host_path: false

  web:
    <<: *app
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2"]
    ports:
      - "127.0.0.1:${WEB_PORT:?}:8000"
    restart: unless-stopped

  scheduler:
    <<: *app
    command:
      - sh
      - -ec
      - |
        python manage.py start_cycle_task
        python manage.py start_penalty_task
        exec python manage.py process_tasks
    restart: unless-stopped

volumes:
  postgres_data:
